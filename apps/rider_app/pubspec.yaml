name: rider_app
description: Go-Volts rider mobile app.
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  design_system:
    path: ../../packages/design_system
  app_models:
    path: ../../packages/app_models
  api_client:
    path: ../../packages/api_client
  app_config:
    path: ../../packages/app_config
  go_router: ^14.6.3
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.18.3
