  firebase_messaging: ^17.0.1
  geolocator: ^14.1.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.8
  permission_handler: ^13.0.2
  connectivity_plus: ^6.1.0
  intl: ^0.19.0
  pinput: ^6.0.2
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
