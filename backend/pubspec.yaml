name: backend
description: Go-Volts Dart backend API server and background worker.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  # HTTP server
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_cors_headers: ^0.1.5

  # Shared models
  app_models:
    path: ../packages/app_models

  # Supabase / PostgreSQL
  supabase: ^2.8.4
  postgres: ^3.5.4

  # Auth / JWT
  dart_jsonwebtoken: ^3.0.0

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Crypto / Security
  crypto: ^3.0.6
  uuid: ^4.5.1

  # HTTP client (for provider calls)
  http: ^1.3.0

  # Logging & Observability
  logging: ^1.3.0

  # Utilities
  dotenv: ^4.2.0
  collection: ^1.18.0

dev_dependencies:
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  lints: ^6.0.0
  test: ^1.25.10
  mocktail: ^1.0.4
