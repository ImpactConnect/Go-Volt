services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database with Automatic Schema Migrations
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: govolts_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: govolts_db
      POSTGRES_USER: govolts_user
      POSTGRES_PASSWORD: govolts_secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govolts_user -d govolts_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Cache & Ephemeral Session Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: govolts_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # Go_Volt Dart REST API Backend Server
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: govolts_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ENVIRONMENT: development
      DATABASE_URL: postgres://govolts_user:govolts_secret_password@postgres:5432/govolts_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_key_govolt_production_2026
      PAYSTACK_SECRET_KEY: sk_test_mock_paystack_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Go_Volt Admin Web Portal (Flutter Web + Nginx)
  # ----------------------------------------------------------------------------
  admin_web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_DIR: apps/admin_web
    container_name: govolts_admin_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ----------------------------------------------------------------------------
  # Go_Volt Merchant Web Portal (Flutter Web + Nginx)
  # ----------------------------------------------------------------------------
  merchant_portal:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_DIR: apps/merchant_portal
    container_name: govolts_merchant_portal
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
