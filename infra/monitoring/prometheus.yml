# ==============================================================================
# Go_Volt Prometheus Operational Monitoring Configuration
# Configured per Technical Specification §13 (Metrics, Logs, Traces)
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: 'production'
    cluster: 'lagos-primary'

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # ----------------------------------------------------------------------------
  # Go_Volt Dart REST API Backend Metrics
  # ----------------------------------------------------------------------------
  - job_name: 'govolts-backend'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'api-server'
          tier: 'backend'

  # ----------------------------------------------------------------------------
  # PostgreSQL Database Exporter (Connection saturation, transaction latency)
  # ----------------------------------------------------------------------------
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          tier: 'database'

  # ----------------------------------------------------------------------------
  # Redis Cache & Ephemeral Session Exporter (Memory, hit rate, queue age)
  # ----------------------------------------------------------------------------
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          tier: 'cache'

  # ----------------------------------------------------------------------------
  # Node Exporter (Host CPU, RAM, Disk I/O, Network)
  # ----------------------------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          tier: 'infrastructure'
