name: api_client
description: Go-Volts typed REST API client with auth headers and error parsing.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  app_models:
    path: ../app_models
  app_config:
    path: ../app_config
  dio: ^5.7.0
  retrofit: ^4.4.2
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  build_runner: ^2.4.13
  retrofit_generator: ^9.1.5
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
